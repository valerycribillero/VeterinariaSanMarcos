<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Veterinaria San Marcos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg bg-white shadow-sm">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <img src="img/logo.png"
                         alt="Logo"
                         width="45"
                         height="45"
                         class="me-2">
                    <span class="fw-bold">Veterinaria San Marcos</span>
                </a>

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="inicio.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="nosotros.html">Nosotros</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="servicios.html">Servicios</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="contacto.html">Contacto</a>
                        </li>
                    </ul>

                    <div class="d-flex align-items-center mt-3 mt-lg-0">
                        <a href="cita.html" class="btn btn-primary">
                            Pedir cita
                        </a>
                        <a href="login.html" class="btn btn-primary ms-2">
                            Login
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5" style="max-width: 650px;">
        <div class="card shadow-sm p-4">
            <h2 class="text-center mb-4">FORMULARIO DE CONTACTO</h2>
            <form id="contactForm" novalidate>
                <div class="mb-3">
                    <label for="nombre" class="form-label font-weight-bold">NOMBRE COMPLETO</label>
                    <input type="text" class="form-control" id="nombre" maxlength="100" required>
                    <div class="text-danger small mt-1" id="errNombre"></div>
                </div>

                <div class="mb-3">
                    <label for="correo" class="form-label">CORREO ELECTRÓNICO</label>
                    <input type="email" class="form-control" id="correo" maxlength="100" required>
                    <div class="text-danger small mt-1" id="errCorreo"></div>
                </div>

                <div class="mb-3">
                    <label for="comentario" class="form-label">MENSAJE / COMENTARIO</label>
                    <textarea class="form-control" id="comentario" maxlength="500" rows="5" required></textarea>
                    <div class="text-danger small mt-1" id="errComentario"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100">ENVIAR MENSAJE</button>
            </form>
        </div>
    </main>

    <footer class="bg-light py-4 border-top mt-auto">
        <div class="container text-center text-muted">
            <p class="mb-0">&copy; 2026 Veterinaria San Marcos. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="contacto.js"></script>
</body>
</html>

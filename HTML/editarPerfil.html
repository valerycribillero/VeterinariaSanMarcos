<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar perfil</title>
    <link rel="stylesheet" href="../CSS/editarPerfil.css">
    <link rel="stylesheet" href="../CSS/menuAd.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex">
    <!-- MENÚ LATERAL -->
    <aside class="p-3 d-flex flex-column">
        <a href="../HTML/admin.html">
            <img src="../img/logo.png" alt="Logo">
            <span>Veterinaria San Marcos</span>
        </a>
        <p>MENÚ PRINCIPAL</p>
        <ul class="nav nav-pills flex-column">
            <li class="nav-item">
                <a class="nav-link" href="../HTML/admin.html">Inicio</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="../HTML/usuariosAd.html">Usuarios</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="../HTML/productosAd.html">Productos</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="../HTML/serviciosAd.html">Servicios</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="../HTML/rolesAd.html">Roles</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="../HTML/mensajesAd.html">Mensajes</a>
            </li>
        </ul>
        <div>
            <hr>
            <a class="nav-link active" href="../HTML/perfil.html">
                Mi perfil
            </a>
            <a class="nav-link text-danger" href="../HTML/index.html">
                Cerrar sesión
            </a>
        </div>
    </aside>
    <!-- CONTENIDO -->
    <main class="flex-grow-1">
        <div class="encabezado">
            <div>
                <h1>Editar perfil</h1>
                <p>Administra tus datos personales y de acceso.</p>
            </div>
        </div>
        <!-- DATOS ACTUALES -->
        <div class="perfil-actual">
            <h2>Datos actuales</h2>
            <div class="row">
                <div class="col-md-4 dato-actual">
                    <label>Nombre completo</label>
                    <p id="nombreActual">-</p>
                </div>
                <div class="col-md-4 dato-actual">
                    <label>Usuario</label>
                    <p id="usuarioActual">-</p>
                </div>
                <div class="col-md-4 dato-actual">
                    <label>Rol</label>
                    <p id="rolActual">-</p>
                </div>
            </div>
        </div>
        <!-- FORMULARIO -->
        <div class="formulario">
            <h2>Modificar datos</h2>
            <form id="formEditarPerfil">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nombre" class="form-label">
                            Nombre
                        </label>
                        <input type="text" id="nombre" class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="apellido" class="form-label">
                            Apellido
                        </label>
                        <input type="text" id="apellido" class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="correo" class="form-label">
                            Correo electrónico
                        </label>
                        <input type="email" id="correo" class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="telefono" class="form-label">
                            Teléfono
                        </label>
                        <input type="tel" id="telefono" class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="usuario" class="form-label">
                            Usuario
                        </label>
                        <input type="text" id="usuario" class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="rol" class="form-label">
                            Rol
                        </label>
                        <input type="text" id="rol" class="form-control" readonly>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label">
                            Nueva contraseña
                        </label>
                        <input type="password" id="password" class="form-control"
                            placeholder="Dejar vacío para mantener la actual">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="confirmarPassword" class="form-label">
                            Confirmar contraseña
                        </label>
                        <input type="password" id="confirmarPassword" class="form-control">
                    </div>
                </div>
                <div class="botones">
                    <a href="../HTML/perfilAdmin.html" class="btn btn-cancelar">
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-guardar">
                        Guardar cambios
                    </button>
                </div>
            </form>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/editarPerfil.js"></script>
</body>
</html>

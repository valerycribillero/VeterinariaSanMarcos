<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil | Veterinaria San Marcos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="../CSS/perfil.css">
    <link rel="stylesheet" href="../CSS/menuAd.css">
</head>
<body class="d-flex bg-light">
    <!-- =========================
         MENÚ VERTICAL
    ========================= -->
    <aside>
        <a href="../HTML/admin.html">
            <img src="../img/logo.png"
                alt="Logo Veterinaria San Marcos"
                width="45"
                height="45">
            <span>
                Veterinaria<br>
                San Marcos
            </span>
        </a>
        <p>
            Administración
        </p>
        <ul>
            <li>
                <a href="../HTML/admin.html">
                    Inicio
                </a>
            </li>
            <li>
                <a href="../HTML/usuariosAd.html">
                    Usuarios
                </a>
            </li>
            <li>
                <a href="../HTML/productosAd.html">
                    Productos
                </a>
            </li>
            <li>
                <a href="../HTML/serviciosAd.html">
                    Servicios
                </a>
            </li>
            <li>
                <a href="../HTML/mensajesAd.html">
                    Mensajes
                </a>
            </li>
            <li>
                <a href="../HTML/rolesAd.html">
                    Roles
                </a>
            </li>
        </ul>
        <div>
            <hr>
            <ul>
                <li>
                    <a href="../HTML/perfilAdmin.html" class="active">
                        Mi perfil
                    </a>
                </li>
                <li>
                    <a href="../HTML/index.html">
                        Cerrar sesión
                    </a>
                </li>
            </ul>
        </div>
    </aside>
    <!-- =========================
         CONTENIDO
    ========================= -->
    <main class="flex-grow-1">
        <div class="encabezado">
            <div>
                <h1>
                    Mi perfil
                </h1>
                <p>
                    Visualiza tus datos personales y de acceso.
                </p>
            </div>
        </div>
        <!-- =========================
             PERFIL
        ========================= -->
        <div class="card perfil-card">
            <div class="card-body">
                <div class="perfil-header">
                    <div class="perfil-icono">
                        <span>👤</span>
                    </div>
                    <div>
                        <h2 id="nombreCompleto">
                            Administrador
                        </h2>
                        <span id="rolUsuario" class="rol">
                            Administrador
                        </span>
                    </div>
                </div>
                <hr>
                <div class="row">
                    <div class="col-md-6">
                        <label>Nombre</label>
                        <p id="nombre">-</p>
                    </div>
                    <div class="col-md-6">
                        <label>Apellidos</label>
                        <p id="apellido">-</p>
                    </div>
                    <div class="col-md-6">
                        <label>Correo electrónico</label>
                        <p id="correo">-</p>
                    </div>
                    <div class="col-md-6">
                        <label>Teléfono</label>
                        <p id="telefono">-</p>
                    </div>
                    <div class="col-md-6">
                        <label>RUN</label>
                        <p id="run">-</p>
                    </div>
                    <div class="col-md-6">
                        <label>Rol</label>
                        <p id="rol">-</p>
                    </div>
                </div>
                <div class="botones">
                    <a href="../HTML/editarPerfil.html" class="btn btn-editar">
                        Editar perfil
                    </a>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/perfil.js"></script>
</body>
</html>

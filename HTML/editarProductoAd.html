<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar producto - Veterinaria San Marcos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/editarProductoAd.css">
    <link rel="stylesheet" href="../CSS/menuAd.css">
</head>
<body class="d-flex bg-light">
    <!-- Menú vertical -->
    <aside class="p-3 d-flex flex-column">
        <a href="../HTML/admin.html" class="d-flex align-items-center gap-2 text-decoration-none mb-4">
            <img src="../img/logo.png" alt="Logo Veterinaria San Marcos" width="45" height="45">
            <span class="fw-bold">Veterinaria<br>San Marcos</span>
        </a>
        <p class="text-uppercase small mb-2">Administración</p>
        <ul class="nav nav-pills flex-column">
            <li class="nav-item">
                <a href="../HTML/admin.html" class="nav-link">Inicio</a>
            </li>
            <li class="nav-item">
                <a href="../HTML/usuariosAd.html" class="nav-link">Usuarios</a>
            </li>
            <li class="nav-item">
                <a href="/HTML/serviciosAd.html" class="nav-link">Servicios</a>
            </li>
            <li class="nav-item">
                <a href="../HTML/mensajesAd.html" class="nav-link">Mensajes</a>
            </li>
        </ul>
        <div class="mt-auto">
            <hr>
            <ul class="nav nav-pills flex-column">
                <li class="nav-item">
                    <a href="../HTML/perfil.html" class="nav-link">Mi perfil</a>
                </li>
                <li class="nav-item">
                    <a href="../HTML/veterinaria.html" class="nav-link text-danger">Cerrar sesión</a>
                </li>
            </ul>
        </div>
    </aside>
    <!-- Contenido -->
    <main class="flex-grow-1">
        <div class="container-fluid">
            <h1>Editar producto</h1>
            <p>Modifica los datos del producto seleccionado.</p>
            <div class="card mt-4">
                <div class="card-body">
                    <form id="formEditarProducto">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="codigo" class="form-label">Código</label>
                                <input type="text" id="codigo" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="categoria" class="form-label">Categoría</label>
                                <select id="categoria" class="form-select" required>
                                    <option value="">Selecciona una categoría</option>
                                    <option value="Alimentos">Alimentos</option>
                                    <option value="Medicamentos">Medicamentos</option>
                                    <option value="Higiene">Higiene</option>
                                    <option value="Accesorios">Accesorios</option>
                                    <option value="Juguetes">Juguetes</option>
                                </select>
                            </div>
                            <div class="col-12 mb-3">
                                <label for="nombre" class="form-label">Nombre del producto</label>
                                <input type="text" id="nombre" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="precio" class="form-label">Precio</label>
                                <input type="number" id="precio" class="form-control" min="0" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="stock" class="form-label">Stock</label>
                                <input type="number" id="stock" class="form-control" min="0" required>
                            </div>
                            <div class="col-12 mb-3">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <textarea id="descripcion" class="form-control" rows="4" required></textarea>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Guardar cambios</button>
                        <a href="../HTML/admin.html" class="btn btn-secondary">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src=../JS/editarProductoAd.js"></script>
</body>
</html>

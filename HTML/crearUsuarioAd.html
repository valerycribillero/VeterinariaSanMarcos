<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo usuario | Veterinaria San Marcos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="CSS/crearUsuario.css">
    <link rel="stylesheet" href="CSS/menuAd.css">
</head>
<body class="d-flex bg-light">
    <!-- =========================
         MENÚ VERTICAL
    ========================= -->
    <aside>
        <a href="admin.html">
            <img src="img/logo.png"
                alt="Logo Veterinaria San Marcos"
                width="45"
                height="45">
            <span>
                Veterinaria<br>
                San Marcos
            </span>
        </a>
        <p>Administración</p>
        <ul>
            <li>
                <a href="admin.html">
                    Inicio
                </a>
            </li>
            <li>
                <a href="usuariosAd.html" class="active">
                    Usuarios
                </a>
            </li>
            <li>
                <a href="serviciosAd.html">
                    Servicios
                </a>
            </li>
            <li>
                <a href="mensajesAd.html">
                    Mensajes
                </a>
            </li>
        </ul>
        <div>
            <hr>
            <ul>
                <li>
                    <a href="perfil.html">
                        Mi perfil
                    </a>
                </li>
                <li>
                    <a href="index.html">
                        Cerrar sesión
                    </a>
                </li>
            </ul>
        </div>
    </aside>
    <!-- =========================
         CONTENIDO PRINCIPAL
    ========================= -->
    <main class="flex-grow-1 p-4">
        <div class="mb-4">
            <h1 class="h3">
                Nuevo usuario
            </h1>
            <p class="text-muted">
                Completa los datos para registrar un usuario.
            </p>
        </div>
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <form id="formCrearUsuarioAd">
                    <div class="row">
                        <!-- RUN -->
                        <div class="col-md-6 mb-3">
                            <label for="run" class="form-label">
                                RUN
                            </label>
                            <input type="text"
                                id="run"
                                class="form-control"
                                placeholder="Sin puntos ni guion"
                                maxlength="9"
                                required>
                        </div>
                        <!-- Rol -->
                        <div class="col-md-6 mb-3">
                            <label for="rol" class="form-label">
                                Perfil / rol
                            </label>
                            <select id="rol"
                                class="form-select"
                                required>
                                <option value="">
                                    Selecciona un perfil
                                </option>
                                <option value="Administrador">
                                    Administrador
                                </option>
                                <option value="Vendedor">
                                    Vendedor
                                </option>
                            </select>
                        </div>
                        <!-- Nombre -->
                        <div class="col-md-6 mb-3">
                            <label for="nombre" class="form-label">
                                Nombre
                            </label>
                            <input type="text"
                                id="nombre"
                                class="form-control"
                                required>
                        </div>
                        <!-- Apellidos -->
                        <div class="col-md-6 mb-3">
                            <label for="apellidos" class="form-label">
                                Apellidos
                            </label>
                            <input type="text"
                                id="apellidos"
                                class="form-control"
                                required>
                        </div>
                        <!-- Correo -->
                        <div class="col-md-6 mb-3">
                            <label for="correo" class="form-label">
                                Correo electrónico
                            </label>
                            <input type="email"
                                id="correo"
                                class="form-control"
                                placeholder="nombre@correo.cl"
                                maxlength="100"
                                required>
                        </div>
                        <!-- Contraseña -->
                        <div class="col-md-6 mb-3">
                            <label for="password" class="form-label">
                                Contraseña
                            </label>
                            <input type="password"
                                id="password"
                                class="form-control"
                                placeholder="Entre 4 y 10 caracteres"
                                minlength="4"
                                maxlength="10"
                                required>
                        </div>
                        <!-- Teléfono -->
                        <div class="col-md-6 mb-3">
                            <label for="telefono" class="form-label">
                                Teléfono
                            </label>
                            <input type="tel"
                                id="telefono"
                                class="form-control"
                                placeholder="+56 9 1234 5678">
                        </div>
                        <!-- Región -->
                        <div class="col-md-6 mb-3">
                            <label for="region" class="form-label">
                                Región
                            </label>
                            <select id="region"
                                class="form-select"
                                required>
                                <option value="">
                                    Selecciona una región
                                </option>
                            </select>
                        </div>
                        <!-- Comuna -->
                        <div class="col-md-6 mb-3">
                            <label for="comuna" class="form-label">
                                Comuna
                            </label>
                            <select id="comuna"
                                class="form-select"
                                disabled
                                required>
                                <option value="">
                                    Primero selecciona una región
                                </option>
                            </select>
                        </div>
                        <!-- Dirección -->
                        <div class="col-12 mb-3">
                            <label for="direccion" class="form-label">
                                Dirección
                            </label>
                            <input type="text"
                                id="direccion"
                                class="form-control"
                                placeholder="Ejemplo: Av. Lopez Bello 123"
                                required>
                        </div>
                    </div>
                    <!-- Botones -->
                    <div class="d-flex gap-2">
                        <button type="submit"
                            class="btn btn-primary">
                            Guardar usuario
                        </button>
                        <a href="usuariosAd.html"
                            class="btn btn-secondary">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="crearUsuarioAd.js"></script>
</body>
</html>

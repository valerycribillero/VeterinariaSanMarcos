<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo servicio | Veterinaria San Marcos</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/crearServicioAd.css">
    <link rel="stylesheet" href=../CSS/"menuAd.css">
</head>
<body class="d-flex bg-light">
    <!-- MENÚ VERTICAL -->
    <aside class="p-3 d-flex flex-column">
        <!-- Logo -->
        <a href="../HTML/admin.html" class="d-flex align-items-center gap-2 text-decoration-none mb-4">
            <img src="../img/logo.png"
                alt="Logo Veterinaria San Marcos"
                width="45"
                height="45">
            <span class="fw-bold">
                Veterinaria<br>
                San Marcos
            </span>
        </a>
        <!-- Título -->
        <p class="text-uppercase small mb-2">
            Administración
        </p>
        <!-- Menú principal -->
        <ul class="nav nav-pills flex-column">
            <li class="nav-item">
                <a href="../HTML/admin.html" class="nav-link">
                    Inicio
                </a>
            </li>
            <li class="nav-item">
                <a href="../HTML/usuariosAd.html" class="nav-link">
                    Usuarios
                </a>
            </li>
            <li class="nav-item">
                <a href="../HTML/productosAd.html" class="nav-link">
                    Productos
                </a>
            </li>
            <li class="nav-item">
                <a href="../HTML/serviciosAd.html" class="nav-link active">
                    Servicios
                </a>
            </li>
            <li class="nav-item">
                <a href="../HTML/rolesAd.html" class="nav-link">
                    Roles
                </a>
            </li>
            <li class="nav-item">
                <a href="../HTML/mensajesAd.html" class="nav-link">
                    Mensajes
                </a>
            </li>
        </ul>
        <!-- Menú inferior -->
        <div class="mt-auto">
            <hr>
            <ul class="nav nav-pills flex-column">
                <li class="nav-item">
                    <a href="../HTML/perfil.html" class="nav-link">
                        Mi perfil
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../HTML/veterinaria.html" class="nav-link text-danger">
                        Cerrar sesión
                    </a>
                </li>
            </ul>
        </div>
    </aside>
    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-grow-1">
        <!-- Encabezado -->
        <div class="encabezado">
            <div>
                <h1>
                    Nuevo servicio
                </h1>
                <p>
                    Completa los datos para agregar un servicio al catálogo.
                </p>
            </div>
        </div>
        <!-- Mensaje -->
        <div id="mensajeExito"
            class="alert alert-success mt-3"
            style="display: none;">
        </div>
        <!-- Formulario -->
        <div class="card mt-4">
            <div class="card-body">
                <form id="formCrearServicio">
                    <div class="row">
                        <!-- Código -->
                        <div class="col-md-6 mb-3">
                            <label for="codigo" class="form-label">
                                Código
                            </label>
                            <input type="text"
                                id="codigo"
                                class="form-control"
                                placeholder="Ej: SV006"
                                required>
                        </div>
                        <!-- Categoría -->
                        <div class="col-md-6 mb-3">
                            <label for="categoria" class="form-label">
                                Categoría
                            </label>
                            <select id="categoria"
                                class="form-select"
                                required>
                                <option value="">
                                    Seleccionar categoría
                                </option>
                            </select>
                        </div>
                        <!-- Nombre -->
                        <div class="col-md-6 mb-3">
                            <label for="nombre" class="form-label">
                                Nombre del servicio
                            </label>
                            <input type="text"
                                id="nombre"
                                class="form-control"
                                placeholder="Ej: Consulta general"
                                required>
                        </div>
                        <!-- Especie -->
                        <div class="col-md-6 mb-3">
                            <label for="especie" class="form-label">
                                Especie
                            </label>
                            <select id="especie"
                                class="form-select"
                                required>
                                <option value="">
                                    Seleccionar especie
                                </option>
                            </select>
                        </div>
                        <!-- Duración -->
                        <div class="col-md-6 mb-3">
                            <label for="duracion" class="form-label">
                                Duración
                            </label>
                            <input type="text"
                                id="duracion"
                                class="form-control"
                                placeholder="Ej: 30 min"
                                required>
                        </div>
                        <!-- Precio -->
                        <div class="col-md-6 mb-3">
                            <label for="precio" class="form-label">
                                Precio (CLP)
                            </label>
                            <input type="number"
                                id="precio"
                                class="form-control"
                                min="1"
                                placeholder="Ej: 15000"
                                required>
                        </div>
                        <!-- Observaciones -->
                        <div class="col-12 mb-3">
                            <label for="observaciones" class="form-label">
                                Observaciones
                            </label>
                            <textarea id="observaciones"
                                class="form-control"
                                rows="3"
                                placeholder="Ej: Requiere ficha previa"></textarea>
                        </div>
                    </div>
                    <!-- Botones -->
                    <div class="botones mt-3">
                        <a href="../HTML/serviciosAd.html"
                            class="btn btn-cancelar">
                            Cancelar
                        </a>
                        <button type="submit"
                            class="btn btn-guardar">
                            Guardar servicio
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <!-- JavaScript -->
    <script src="../JS/crearServicioAd.js"></script>
</body>
</html>

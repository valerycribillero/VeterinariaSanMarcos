</head>

<body class="d-flex">

    <!-- MENÚ LATERAL -->
    <aside class="p-3 d-flex flex-column">

        <a href="admin.html">
            <img src="img/logo.png" alt="Logo">
            <span>Veterinaria San Marcos</span>
        </a>

        <p>MENÚ PRINCIPAL</p>

        <ul class="nav nav-pills flex-column">

            <li class="nav-item">
                <a class="nav-link" href="admin.html">Inicio</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="usuariosAd.html">Usuarios</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="productosAd.html">Productos</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="serviciosAd.html">Servicios</a>

            <li class="nav-item">
                <a class="nav-link" href="rolesAd.html">Roles</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="mensajesAd.html">Mensajes</a>
            </li>

        </ul>

        <div>
            <hr>

            <a class="nav-link active" href="perfil.html">
                Mi perfil
            </a>

            <a class="nav-link text-danger" href="index.html">
                Cerrar sesión
            </a>
        </div>

    </aside>


    <!-- CONTENIDO -->
    <main class="flex-grow-1">

        <div class="encabezado">
            <div>
                <h1>Mi perfil</h1>
                <p>Visualiza tus datos personales y de acceso.</p>
            </div>
        </div>


        <!-- PERFIL -->
        <div class="card perfil-card">

            <div class="card-body">

                <div class="perfil-header">

                    <div class="perfil-icono">
                        <span>👤</span>
                    </div>

                    <div>
                        <h2 id="nombreCompleto">Administrador</h2>
                        <span id="rolUsuario" class="rol">Administrador</span>
                    </div>

                </div>


                <hr>


                <div class="row">

                    <div class="col-md-6">
                        <label>Nombre</label>
                        <p id="nombre">-</p>
                    </div>

                    <div class="col-md-6">
                        <label>Apellido</label>
                        <p id="apellido">-</p>
                    </div>

                    <div class="col-md-6">
                        <label>Correo electrónico</label>
                        <p id="correo">-</p>
                    </div>

                    <div class="col-md-6">
                        <label>Teléfono</label>
                        <p id="telefono">-</p>
                    </div>

                    <div class="col-md-6">
                        <label>Usuario</label>
                        <p id="usuario">-</p>
                    </div>

                    <div class="col-md-6">
                        <label>Rol</label>
                        <p id="rol">-</p>
                    </div>

                </div>


                <div class="botones">

                    <a href="admin.html" class="btn btn-cancelar">
                        Volver
                    </a>

                    <a href="editarPerfil.html" class="btn btn-editar">
                        Editar perfil
                    </a>

                </div>

            </div>

        </div>


<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi perfil | Veterinaria San Marcos</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="perfil.css">
    <link rel="stylesheet" href="menuAd.css">
</head>

<body class="d-flex bg-light">

    <!-- MENÚ VERTICAL -->

    <aside class="p-3 d-flex flex-column">

        <!-- Logo -->

        <a href="admin.html" class="d-flex align-items-center gap-2 text-decoration-none mb-4">

            <img src="img/logo.png"
                alt="Logo Veterinaria San Marcos"
                width="45"
                height="45">

            <span class="fw-bold">
                Veterinaria<br>
                San Marcos
            </span>

        </a>


        <!-- Título -->

        <p class="text-uppercase small mb-2">
            Administración
        </p>


        <!-- Menú principal -->

        <ul class="nav nav-pills flex-column">

            <li class="nav-item">
                <a href="admin.html" class="nav-link">
                    Inicio
                </a>
            </li>

            <li class="nav-item">
                <a href="usuariosAd.html" class="nav-link">
                    Usuarios
                </a>
            </li>

            <li class="nav-item">
                <a href="productosAd.html" class="nav-link">
                    Productos
                </a>
            </li>

            <li class="nav-item">
                <a href="serviciosAd.html" class="nav-link">
                    Servicios
                </a>
            </li>

            <li class="nav-item">
                <a href="rolesAd.html" class="nav-link">
                    Roles
                </a>
            </li>

            <li class="nav-item">
                <a href="mensajesAd.html" class="nav-link">
                    Mensajes
                </a>
            </li>

        </ul>


        <!-- Menú inferior -->

        <div class="mt-auto">

            <hr>

            <ul class="nav nav-pills flex-column">

                <li class="nav-item">
                    <a href="perfil.html" class="nav-link active">
                        Mi perfil
                    </a>
                </li>

                <li class="nav-item">
                    <a href="index.html" class="nav-link text-danger">
                        Cerrar sesión
                    </a>
                </li>

            </ul>

        </div>

    </aside>


    <!-- CONTENIDO PRINCIPAL -->

    <main class="flex-grow-1">

        <!-- Encabezado -->

        <div class="encabezado">

            <div>

                <h1>
                    Mi perfil
                </h1>

                <p>
                    Administra tus datos personales y de acceso.
                </p>

            </div>

        </div>


        <!-- Mensaje -->

        <div id="mensajeExito"
            class="alert alert-success mt-3"
            style="display: none;">
        </div>


        <!-- Perfil -->

        <div class="card mt-4">

            <div class="card-body">

                <form id="formPerfil">

                    <div class="row">

                        <!-- Nombre -->

                        <div class="col-md-6 mb-3">

                            <label for="nombre" class="form-label">
                                Nombre
                            </label>

                            <input type="text"
                                id="nombre"
                                class="form-control"
                                required>

                        </div>


                        <!-- Apellido -->

                        <div class="col-md-6 mb-3">

                            <label for="apellido" class="form-label">
                                Apellido
                            </label>

                            <input type="text"
                                id="apellido"
                                class="form-control"
                                required>

                        </div>


                        <!-- Correo -->

                        <div class="col-md-6 mb-3">

                            <label for="correo" class="form-label">
                                Correo electrónico
                            </label>

                            <input type="email"
                                id="correo"
                                class="form-control"
                                required>

                        </div>


                        <!-- Teléfono -->

                        <div class="col-md-6 mb-3">

                            <label for="telefono" class="form-label">
                                Teléfono
                            </label>

                            <input type="tel"
                                id="telefono"
                                class="form-control"
                                placeholder="Ej: +56 9 1234 5678">

                        </div>


                        <!-- Rol -->

                        <div class="col-md-6 mb-3">

                            <label for="rol" class="form-label">
                                Rol
                            </label>

                            <input type="text"
                                id="rol"
                                class="form-control"
                                value="Administrador"
                                readonly>

                        </div>


                        <!-- Usuario -->

                        <div class="col-md-6 mb-3">

                            <label for="usuario" class="form-label">
                                Usuario
                            </label>

                            <input type="text"
                                id="usuario"
                                class="form-control"
                                required>

                        </div>


                        <!-- Contraseña -->

                        <div class="col-md-6 mb-3">

                            <label for="password" class="form-label">
                                Nueva contraseña
                            </label>

                            <input type="password"
                                id="password"
                                class="form-control"
                                placeholder="Dejar vacío para mantener la actual">

                        </div>


                        <!-- Confirmar contraseña -->

                        <div class="col-md-6 mb-3">

                            <label for="confirmarPassword" class="form-label">
                                Confirmar contraseña
                            </label>

                            <input type="password"
                                id="confirmarPassword"
                                class="form-control"
                                placeholder="Repite la nueva contraseña">

                        </div>

                    </div>


                    <!-- Botones -->

                    <div class="botones mt-3">

                        <a href="admin.html"
                            class="btn btn-cancelar">
                            Cancelar
                        </a>

                        <button type="submit"
                            class="btn btn-guardar">
                            Guardar cambios
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="perfil.js"></script>

</body>

</html>

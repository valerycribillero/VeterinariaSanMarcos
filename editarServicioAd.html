
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar servicio | Veterinaria San Marcos</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS de esta página -->
    <link rel="stylesheet" href="editarServicioAd.css">

    <!-- CSS común del menú -->
    <link rel="stylesheet" href="menuAd.css">

</head>

<body class="d-flex bg-light">

    <!-- =========================
         MENÚ VERTICAL
         ========================= -->

    <aside>

        <!-- Logo -->
        <a href="admin.html">

            <img src="img/logo.png"
                alt="Logo Veterinaria San Marcos"
                width="45"
                height="45">

            <span>
                Veterinaria<br>
                San Marcos
            </span>

        </a>

        <!-- Título -->
        <p>
            Administración
        </p>

        <!-- Menú principal -->
        <ul>

            <li>
                <a href="admin.html">
                    Inicio
                </a>
            </li>

            <li>
                <a href="usuariosAd.html">
                    Usuarios
                </a>
            </li>

            <li>
                <a href="serviciosAd.html" class="active">
                    Servicios
                </a>
            </li>

            <li>
                <a href="mensajesAd.html">
                    Mensajes
                </a>
            </li>

        </ul>

        <!-- Menú inferior -->
        <div>

            <hr>

            <ul>

                <li>
                    <a href="perfil.html">
                        Mi perfil
                    </a>
                </li>

                <li>
                    <a href="index.html">
                        Cerrar sesión
                    </a>
                </li>

            </ul>

        </div>

    </aside>


    <!-- =========================
         CONTENIDO PRINCIPAL
         ========================= -->

    <main class="flex-grow-1 p-4">

        <!-- Encabezado -->
        <div class="mb-4">

            <h1 class="h3">
                Editar servicio
            </h1>

            <p>
                Modifica los datos del servicio seleccionado.
            </p>

        </div>


        <!-- Formulario -->
        <div class="card shadow-sm border-0">

            <div class="card-body">

                <form id="formEditarServicio">

                    <div class="row">

                        <!-- ID -->
                        <div class="col-md-6 mb-3">

                            <label for="id" class="form-label">
                                ID del servicio
                            </label>

                            <input type="text"
                                id="id"
                                class="form-control"
                                readonly>

                        </div>


                        <!-- Estado -->
                        <div class="col-md-6 mb-3">

                            <label for="estado" class="form-label">
                                Estado
                            </label>

                            <select id="estado"
                                class="form-select"
                                required>

                                <option value="">
                                    Selecciona un estado
                                </option>

                                <option value="Disponible">
                                    Disponible
                                </option>

                                <option value="No disponible">
                                    No disponible
                                </option>

                            </select>

                        </div>


                        <!-- Nombre -->
                        <div class="col-12 mb-3">

                            <label for="nombre" class="form-label">
                                Nombre del servicio
                            </label>

                            <input type="text"
                                id="nombre"
                                class="form-control"
                                placeholder="Ejemplo: Consulta veterinaria"
                                maxlength="100"
                                required>

                        </div>


                        <!-- Descripción -->
                        <div class="col-12 mb-3">

                            <label for="descripcion" class="form-label">
                                Descripción
                            </label>

                            <textarea id="descripcion"
                                class="form-control"
                                rows="4"
                                maxlength="500"
                                placeholder="Describe el servicio..."
                                required></textarea>

                        </div>


                        <!-- Precio -->
                        <div class="col-md-6 mb-3">

                            <label for="precio" class="form-label">
                                Precio
                            </label>

                            <input type="number"
                                id="precio"
                                class="form-control"
                                min="0"
                                placeholder="Ejemplo: 25000"
                                required>

                        </div>

                    </div>


                    <!-- Botones -->
                    <div class="d-flex gap-2">

                        <button type="submit"
                            class="btn btn-primary">

                            Guardar cambios

                        </button>

                        <a href="serviciosAd.html"
                            class="btn btn-secondary">

                            Cancelar

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </main>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script src="editarServicioAd.js"></script>

</body>

</html>
